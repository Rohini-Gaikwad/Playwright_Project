name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    env:
      HOST_NAME: ${{ secrets.HOST_NAME }}
      UI_HOST_NAME: ${{ secrets.UI_HOST_NAME }}
      API_HOST_NAME: ${{ secrets.API_HOST_NAME }}
      TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Print URL
      run: echo "HOST_NAME is $HOST_NAME"
    - name: Check environment variables
      run: |
          echo "HOST_NAME configured: $([ -n "$HOST_NAME" ] && echo yes || echo no)"
          echo "UI_HOST_NAME configured: $([ -n "$UI_HOST_NAME" ] && echo yes || echo no)"
          echo "API_HOST_NAME configured: $([ -n "$API_HOST_NAME" ] && echo yes || echo no)"
          echo "TEST_USERNAME configured: $([ -n "$TEST_USERNAME" ] && echo yes || echo no)"
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
